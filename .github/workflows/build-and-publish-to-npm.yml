name: Publish Node.js Package

on:
    release:
        types: [created]

permissions:
    contents: read
    id-token: write # required for npm Trusted Publishing (OIDC)

jobs:
    publish-npm-package:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: "24"
                  registry-url: https://registry.npmjs.org/

            # Trusted Publishing requires npm >= 11.5.1, which is newer than the
            # version bundled with Node 24.
            - name: Update npm
              run: npm install -g npm@latest

            # Enable Corepack and activate the Yarn version from package.json
            - name: Enable Corepack & activate Yarn 4
              run: |
                  corepack enable
                  corepack prepare yarn@4.10.3 --activate
                  yarn --version

            - name: Install dependencies
              run: yarn install --immutable

            - name: Run tests
              run: yarn test

            - name: Build project
              run: yarn build

            # Authentication is handled automatically via OIDC (Trusted Publishing),
            # so no NODE_AUTH_TOKEN / .npmrc token is needed. Provenance is generated
            # automatically for trusted publishers.
            - name: Publish to npm
              run: npm publish --access public
